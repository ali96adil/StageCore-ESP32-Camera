; First-stage serial hardware probe; NOT the production MJPEG firmware.
; The user's physical probe confirmed 4 MB flash, ~4 MB PSRAM and OV2640.
; Firmware environments share the verified AI Thinker pin profile.
[platformio]
default_envs = esp32cam_probe

[env:esp32cam_probe]
platform = espressif32@6.10.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

[env:esp32cam_stream]
extends = env:esp32cam_probe
build_flags =
  ${env:esp32cam_probe.build_flags}
  -DSTAGECORE_STREAM_FIRMWARE

; Secure Stage Device v2 Foundation candidate. This is CI/source-only and does
; NOT replace the proven Arduino camera/stream firmware. It does not initialize
; the camera or expose flash/output control.
[env:esp32cam_foundation_v2_candidate]
platform = espressif32@6.12.0
board = esp32cam
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = foundation_partitions.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.foundation.defaults"
build_flags =
  -DSTAGECORE_FOUNDATION_V2_CANDIDATE=1
  -DSTAGECORE_FW_VERSION=\"0.2.0-dev.1\"
