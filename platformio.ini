; First-stage serial hardware probe; NOT the production MJPEG firmware.
; 4 MB is the reference board profile assumption pending physical detection.
[platformio]
default_envs = esp32cam_probe

[env:esp32cam_probe]
platform = espressif32@6.10.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
