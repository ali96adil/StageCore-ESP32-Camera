; First-stage serial hardware probe; NOT the production MJPEG firmware.
; The user's physical probe confirmed 4 MB flash, ~4 MB PSRAM and OV2640.
; Firmware environments share the verified AI Thinker pin profile.
[platformio]
default_envs = esp32cam_probe

[env:esp32cam_probe]
platform = espressif32@6.10.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

[env:esp32cam_stream]
extends = env:esp32cam_probe
build_flags =
  ${env:esp32cam_probe.build_flags}
  -DSTAGECORE_STREAM_FIRMWARE

; Experimental quality gate: same hardware and endpoints, SVGA only when PSRAM present.
; NEVER flash onto show camera before capturing VGA baseline and verifying RSSI.
[env:esp32cam_stream_svga_trial]
extends = env:esp32cam_stream
build_flags =
  ${env:esp32cam_stream.build_flags}
  -DSTAGECORE_CAM_SVGA_TRIAL
