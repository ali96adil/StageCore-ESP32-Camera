; First-stage serial hardware probe; NOT the production MJPEG firmware.
; The user's physical probe confirmed 4 MB flash, ~4 MB PSRAM and OV2640.
; Firmware environments share the verified AI Thinker pin profile.
[platformio]
default_envs = esp32cam_probe

[env:esp32cam_probe]
build_src_filter =
  +<*.cpp>
  -<v2_foundation/>
platform = espressif32@6.10.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue

[env:esp32cam_stream]
extends = env:esp32cam_probe
build_flags =
  ${env:esp32cam_probe.build_flags}
  -DSTAGECORE_STREAM_FIRMWARE


; SOURCE-ONLY secure Firmware Foundation C1 candidate.
; This image deliberately contains NO camera capture, MJPEG or flash-output path.
; It reuses already-provisioned Wi-Fi credentials only to prove persistent
; identity, pinned Hub trust, pairing, and inventory-only stagecore.device/2.
[env:esp32cam_v2_foundation_c1]
platform = espressif32@6.12.0
board = esp32cam
framework = espidf
monitor_speed = 115200
upload_speed = 115200
; Explicitly override PlatformIO's 1 MiB ESP-IDF default app partition.
; The physical board has verified 4 MiB flash and C1 intentionally has no OTA.
board_build.partitions = partitions_singleapp_large.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.v2_foundation.defaults"
  -DSTAGECORE_CAMERA_V2_FOUNDATION_C1=ON
build_flags =
  -DSTAGECORE_FW_VERSION=\"0.2.0-dev.c1\"


; SOURCE-ONLY secure Firmware Foundation C2 candidate.
; C2 keeps camera capture/MJPEG/flash disabled and adds only authenticated
; Setup/Recovery AP credential maintenance over stagecore.device/2.
[env:esp32cam_v2_foundation_c2]
platform = espressif32@6.12.0
board = esp32cam
framework = espidf
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = partitions_singleapp_large.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.v2_foundation.defaults"
  -DSTAGECORE_CAMERA_V2_FOUNDATION_C2=ON
build_flags =
  -DSTAGECORE_FW_VERSION=\"0.2.0-dev.c2\"
  -DSTAGECORE_CAMERA_V2_FOUNDATION_C2=1


; SOURCE-ONLY Camera Foundation C3 scaffold.
; C3 inherits all C2 security/maintenance behavior but only adds the pinned
; native esp32-camera component at this stage. Camera capture/MJPEG/flash stay
; disabled until the next C3 batch ports the already-qualified behavior.
[env:esp32cam_v2_foundation_c3]
platform = espressif32@6.12.0
board = esp32cam
framework = espidf
monitor_speed = 115200
upload_speed = 115200
; Preserve the exact legacy Arduino partition offsets on the physical camera.
; The default single-app layout would overlap persisted OTA data and expand NVS.
board_build.partitions = partitions_camera_legacy.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.v2_foundation.defaults;sdkconfig.v2_camera.defaults"
  -DSTAGECORE_CAMERA_V2_FOUNDATION_C2=ON
  -DSTAGECORE_CAMERA_V2_FOUNDATION_C3=ON
build_flags =
  -DSTAGECORE_FW_VERSION=\"0.2.0-dev.c3\"
  -DSTAGECORE_CAMERA_V2_FOUNDATION_C2=1
  -DSTAGECORE_CAMERA_V2_FOUNDATION_C3=1
