name: Firmware build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hardware-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Test Wi-Fi recovery policy
        run: g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/wifi_recovery_policy_test.cpp -o /tmp/wifi-recovery-policy && /tmp/wifi-recovery-policy
      - name: Test shared provisioning AP password contract
        run: python -m unittest tests/provisioning_contract_test.py -v
      - name: Build serial hardware probe
        run: pio run -e esp32cam_probe
      - name: Build unqualified Wi-Fi MJPEG firmware
        run: pio run -e esp32cam_stream
      - name: Stage exact unqualified firmware artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          for ENV_NAME in esp32cam_stream esp32cam_probe; do
            SRC=".pio/build/$ENV_NAME/firmware.bin"
            test -f "$SRC"
            OUT="$RUNNER_TEMP/$ENV_NAME"
            rm -rf "$OUT"
            mkdir -p "$OUT"
            cp "$SRC" "$OUT/firmware.bin"
            sha256sum "$OUT/firmware.bin" > "$OUT/SHA256SUMS"
            {
              echo "source_revision=$EXPECTED_SHA"
              echo "platformio=6.1.18"
              echo "environment=$ENV_NAME"
              echo "board=esp32cam"
              echo "framework=arduino"
              echo "qualification=UNQUALIFIED"
            } > "$OUT/BUILDINFO"
          done
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload exact unqualified stream binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32cam-stream-unqualified
          path: ${{ runner.temp }}/esp32cam_stream/
          if-no-files-found: error
          retention-days: 7
      - name: Upload exact unqualified probe binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32cam-probe-unqualified
          path: ${{ runner.temp }}/esp32cam_probe/
          if-no-files-found: error
          retention-days: 7

  foundation-v2-candidate:
    name: Foundation v2 candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLATFORMIO_DISABLE_UPGRADE_CHECK: "1"
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Verify exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Foundation v2 candidate contract
        run: python -m unittest tests/foundation_v2_candidate_contract_test.py -v
      - name: Install pinned PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0
      - name: Build secure Foundation v2 candidate
        run: pio run -e esp32cam_foundation_v2_candidate
      - name: Stage exact unqualified candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          SRC=".pio/build/esp32cam_foundation_v2_candidate/firmware.bin"
          test -f "$SRC"
          OUT="$RUNNER_TEMP/esp32cam-foundation-v2-candidate"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$SRC" "$OUT/firmware.bin"
          sha256sum "$OUT/firmware.bin" > "$OUT/SHA256SUMS"
          {
            echo "source_revision=$EXPECTED_SHA"
            echo "platformio=6.2.0"
            echo "environment=esp32cam_foundation_v2_candidate"
            echo "board=esp32cam"
            echo "framework=espidf"
            echo "qualification=UNQUALIFIED"
            echo "camera_services=DISABLED"
            echo "flash_authority=DISABLED"
          } > "$OUT/BUILDINFO"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Upload exact unqualified Foundation candidate
        uses: actions/upload-artifact@v4
        with:
          name: esp32cam-foundation-v2-candidate-unqualified
          path: ${{ runner.temp }}/esp32cam-foundation-v2-candidate/
          if-no-files-found: error
          retention-days: 7
